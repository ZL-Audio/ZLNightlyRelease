name: Publish Nightly Release

on:
  workflow_call:
    inputs:
      tag:
        description: Plugin release tag in ZLNightlyRelease
        required: true
        type: string
    secrets:
      NIGHTLY_RELEASE_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    concurrency:
      group: nightly-publish-${{ inputs.tag }}
      cancel-in-progress: false
    steps:
      - name: Download installers from the calling workflow
        uses: actions/download-artifact@v8
        with:
          path: current_release

      - name: Checkout publishing tools
        uses: actions/checkout@v7
        with:
          repository: ZL-Audio/ZLNightlyRelease
          ref: main
          path: nightly_tools
          persist-credentials: false

      - name: Publish complete nightly release
        env:
          GH_TOKEN: ${{ secrets.NIGHTLY_RELEASE_TOKEN }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: python3 nightly_tools/release.py --tag "$RELEASE_TAG" --artifacts current_release
